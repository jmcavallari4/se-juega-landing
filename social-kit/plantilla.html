:root{--fondo:#0a1a0e;--verde:#22d36b;--amarillo:#ffd21f;--blanco:#ffffff;--rojo:#ff6b6b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1b1b1b;font-family:Inter,sans-serif;color:#fff;padding:24px}
.ayuda{max-width:900px;margin:0 auto 24px;font-size:15px;line-height:1.5;color:#ddd}
.fila{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
.marco{display:flex;flex-direction:column;align-items:center;gap:8px}
.vista{overflow:hidden;border-radius:8px}
.vista>.s{transform-origin:top left}
button{background:var(--amarillo);color:#0a1a0e;border:0;border-radius:999px;padding:8px 18px;font-weight:800;cursor:pointer}
/* ===== PLACA ===== */
.s{position:relative;width:1080px;overflow:hidden;color:#fff;font-family:Inter,sans-serif;background:var(--fondo)}
.r45{height:1350px}.r916{height:1920px}
.s .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.s .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,14,8,.72),rgba(4,14,8,.5) 42%,rgba(4,14,8,.93))}
.s .c{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 64px 90px}
.r916 .c{padding:230px 70px 360px}
.logo{font-family:Anton;letter-spacing:1px;line-height:1}.logo .a{color:var(--verde)}.logo .b{color:var(--amarillo)}
h1{font-family:'Lilita One';font-weight:400;line-height:1.02;text-shadow:0 5px 0 rgba(0,0,0,.45)}
.y{color:var(--amarillo)}.g{color:var(--verde)}
.badge{display:inline-flex;align-items:center;gap:10px;border:3px solid var(--amarillo);color:var(--amarillo);border-radius:999px;padding:12px 30px;font-weight:800;font-size:30px;letter-spacing:2px}
.bajada{font-weight:700;font-size:44px;line-height:1.3}
.card{background:rgba(5,22,12,.82);border:2px solid rgba(34,211,107,.45);border-radius:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;width:100%}
.eq{padding:36px 18px 30px;display:flex;flex-direction:column;align-items:center}
.esc{width:220px;height:220px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 6px var(--verde),0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-family:Anton;font-size:84px;color:#fff;letter-spacing:2px}
.esc img{width:88%;height:88%;object-fit:contain}
.esc.ini{background:linear-gradient(135deg,#16a34a,#0a3d1f)}
.eq .nm{font-family:'Lilita One';font-size:44px;line-height:1.05;margin-top:28px}
.eq .zn{font-size:28px;font-weight:500;opacity:.85;margin-top:8px}
.eq .ig{font-size:27px;font-weight:700;color:var(--verde);margin-top:8px;min-height:33px}
.paso{display:flex;align-items:center;gap:28px;text-align:left;padding:30px 36px;width:100%}
.paso .n{font-family:'Lilita One';font-size:90px;color:var(--amarillo);width:70px;text-align:center;line-height:1}
.paso .t{font-size:42px;font-weight:800;line-height:1.15}.paso .t span{display:block;font-size:30px;font-weight:500;opacity:.85;margin-top:6px}
.pill{display:inline-block;background:var(--amarillo);color:#0a1a0e;font-weight:800;border-radius:999px;font-size:46px;padding:26px 56px}
.pie{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:space-between;padding:0 48px;font-size:26px;font-weight:700;opacity:.85;z-index:3}
.r916 .pie{display:none}
</style></head><body>

const fmt=s=>(s||"").replace(/\[\[(.+?)\]\]/g,'<span class="y">$1</span>').replace(/\{\{(.+?)\}\}/g,'<span class="g">$1</span>');
const ini=n=>n.replace(/\b(fc|f\.c|club)\b/ig,"").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const logo=t=>`<div class="logo" style="font-size:${t}px"><span class="a">SE</span> <span class="b">JUEGA</span></div>`;
function placa(p,i,total){
  const r=PUBLICACION.formato==="9:16"?"r916":"r45";
  let body="";
  if(p.tipo==="portada") body=`<div class="c" style="justify-content:space-between">${logo(64)}<div>${p.etiqueta?`<div class="badge">${p.etiqueta}</div>`:""}<h1 style="font-size:150px;margin-top:40px">${fmt(p.titulo)}</h1><p class="bajada" style="margin-top:40px">${fmt(p.bajada)}</p></div><p style="font-size:34px;font-weight:700;opacity:.9">${p.pie||""}</p></div>`;
  if(p.tipo==="equipos") body=`<div class="c">${logo(46)}<h1 style="font-size:78px;margin:30px 0 40px">${fmt(p.titulo)}</h1><div class="grid">${p.equipos.map(e=>`<div class="card eq"><div class="esc ${e.escudo?"":"ini"}">${e.escudo?`<img crossorigin="anonymous" src="${e.escudo}">`:ini(e.nombre)}</div><div class="nm">${e.nombre}</div><div class="zn">📍 ${e.zona}</div><div class="ig">${e.ig||"&nbsp;"}</div></div>`).join("")}</div></div>`;
  if(p.tipo==="pasos") body=`<div class="c" style="justify-content:center;gap:30px"><h1 style="font-size:92px;margin-bottom:16px">${fmt(p.titulo)}</h1>${p.pasos.map((s,k)=>`<div class="card paso"><div class="n">${k+1}</div><div class="t">${s[0]}<span>${s[1]||""}</span></div></div>`).join("")}</div>`;
  if(p.tipo==="cierre") body=`<div class="c" style="justify-content:center;gap:50px"><h1 style="font-size:112px">${fmt(p.titulo)}</h1><p class="bajada">${fmt(p.bajada)}</p><div class="pill">${p.boton||"Link en la bio 👆"}</div></div>`;
  return `<div class="s ${r}" id="placa${i}"><img class="bg" src="${FONDOS[p.fondo||"jugador"]}" style="opacity:${p.fondo==="cancha"?.6:.85}"><div class="ov"></div>${body}<div class="pie"><span>@sejuega_app</span><span>sejuega.net</span></div></div>`;
}
const out=document.getElementById("salida"), esc=0.3;
PUBLICACION.placas.forEach((p,i)=>{
  const h=PUBLICACION.formato==="9:16"?1920:1350;
  const m=document.createElement("div"); m.className="marco";
  m.innerHTML=`<div class="vista" style="width:${1080*esc}px;height:${h*esc}px">${placa(p,i)}</div><button>Descargar ${i+1}</button>`;
  m.querySelector(".s").style.transform=`scale(${esc})`;
  m.querySelector("button").onclick=async()=>{const n=m.querySelector(".s");const t=n.style.transform;n.style.transform="none";
    try{const url=await htmlToImage.toPng(n,{width:1080,height:h,pixelRatio:1});const a=document.createElement("a");a.download=`sejuega-${i+1}.png`;a.href=url;a.click();}
    catch(e){alert("No se pudo descargar: "+e.message);} n.style.transform=t;};
  out.appendChild(m);
});
</script></body></html>
